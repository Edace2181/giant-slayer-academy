<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giant Slayer Academy | Network+ | World 6</title>

    <link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="hydra.png">
</head>

<body class="arcade-body" data-certification="network-plus">

    <div class="crt-overlay"></div>

    <main class="world-screen">

        <!-- INTRO CARD -->
        <section class="world-intro-card">

            <h1 class="arcade-title">❄️ WORLD 6</h1>

            <h2 class="world-subtitle">Mixed Domain Challenge</h2>

            <div class="message-box">

                <p>You've mastered</p>
                <p>each individual skill.</p>

                <br>

                <p>Now it's time</p>
                <p>to bring them together.</p>

                <br>

                <p>Trust your training.</p>

            </div>

            <button id="enterWorldBtn" class="link-btn">
                ▶ PRESS START
            </button>

            <br><br>

            <a href="network-campaign.html" class="back-link">
                ← Return to Campaign Map
            </a>

        </section>

        <!-- TRAINING MENU -->
        <section id="world6-menu" class="hidden">

            <h1 class="arcade-title">❄️ WORLD 6</h1>

            <p class="tagline">
                Choose Your Training Mode
            </p>

            <div class="mode-grid">

                
                <a href="hydra-quiz.html?world=6&amp;mode=mixed-25" class="mode-card">
                    🧭<br>
                    Mixed Run 25
                </a>
                
                <a href="hydra-quiz.html?world=6&amp;mode=mixed-50" class="mode-card">
                    🎮<br>
                    Mixed Run 50
                </a>

                <a href="hydra-quiz.html?world=6&amp;mode=weakness-mix" class="mode-card">
                    🎯<br>
                    Weakness Mix
                </a>

                <a href="hydra-quiz.html?world=6&amp;mode=random-gauntlet" class="mode-card">
                    ⚔️<br>
                    Random Gauntlet
                </a>

            </div>

            <br>

            <a href="network-campaign.html" class="back-link">
                ← Return to Campaign Map
            </a>

        </section>

    </main>

    <script>

        const enterWorldBtn = document.getElementById("enterWorldBtn");
        const introCard = document.querySelector(".world-intro-card");
        const worldMenu = document.getElementById("world6-menu");

        enterWorldBtn.addEventListener("click", () => {

            introCard.style.display = "none";
            worldMenu.classList.remove("hidden");

        });

    </script>

</body>
</html>
