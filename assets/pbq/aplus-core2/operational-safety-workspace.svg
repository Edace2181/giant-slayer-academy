<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Hydra safe repair bay</title><desc id="d">A symbolic repair bay with an ESD bench, electronics recycling station, ventilated service enclosure, and battery isolation container.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#73e4d1"/></marker></defs><rect width="1000" height="560" rx="28" fill="#101a2e"/><g fill="#20394f" stroke="#73e4d1" stroke-width="8"><rect x="120" y="160" width="330" height="150" rx="18"/><path d="M160 310v130M410 310v130"/><rect x="135" y="345" width="120" height="135" rx="14"/><rect x="590" y="85" width="300" height="185" rx="22"/><path d="M640 120h200M680 150h120" marker-end="url(#a)"/><rect x="595" y="345" width="220" height="120" rx="20"/></g><g fill="#f5f8ff" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><text x="285" y="225" font-size="28">GROUNDED BENCH</text><text x="195" y="415" font-size="21">E-WASTE</text><text x="740" y="205" font-size="24">VENTILATED BAY</text><text x="705" y="410" font-size="22">BATTERY</text><text x="705" y="438" font-size="22">ISOLATION</text></g><g fill="#ffd76b" font-family="Arial,sans-serif" font-weight="900" font-size="28"><text x="270" y="130">A</text><text x="690" y="520">B</text><text x="730" y="55">C</text><text x="80" y="475">D</text></g></svg>