<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hydra Academy | Hydra Quiz</title>

    <link rel="stylesheet" href="style.css">

<link rel="icon" type="image/png" href="hydra.png">
</head>

<body class="arcade-body" data-progress-key="hydra-network-plus-progress-v1">

    <div class="crt-overlay"></div>

    <main class="world-screen">

        <section class="world-intro-card">

            <h1 class="arcade-title">
                🐉 HYDRA QUIZ
            </h1>

            <p class="tagline" id="quizInfo">
                🌿 World 1 • 🎮 Story Mode
            </p>

            <div class="player-card">

                <h3 id="objectiveTitle">
                    Objective 1.1
                </h3>

                <p id="objectiveName">
                    Networking Fundamentals
                </p>

            </div>

            <div class="message-box">

                <p id="questionCount">
                    Question 1 of 25
                </p>

                <h2 id="question">
                    Loading Question...
                </h2>

                <div id="answers" class="answers-box">

                    <!-- JavaScript creates the answers here -->

                </div>

                <br>

                <button id="submitBtn" class="link-btn">
                    Submit Answer
                </button>

                <br><br>

                <button id="nextBtn" class="link-btn hidden">
                    Next Question
                </button>

                <p id="feedback" role="status" aria-live="polite" aria-atomic="true"></p>

            </div>

            <div class="player-card">

                <h3>Commander Status</h3>

                <p>
                    🏆 Score:
                    <span id="score">0</span>
                </p>

                <p>
                    🐉 Hydra Rank:
                    <span id="rank">Hatchling</span>
                </p>

                <p>
                    ⚔ Current Mode:
                    <span id="modeDisplay">Objective Sweep</span>
                </p>

            </div>

            <br>

            <a href="#" id="returnLink" class="back-link">
                ← Return to Objective Selection
            </a>

        </section>

    </main>

    <script src="campaign-ui.js"></script>
    <script src="flagged-questions.js"></script>
    <script src="practice-exam-timer.js"></script>
    <script src="quiz.js"></script>
    <script src="objective-quiz-return.js"></script>

</body>
</html>
