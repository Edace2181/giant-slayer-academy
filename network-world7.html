<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giant Slayer Academy | Network+ | World 7</title>

    <link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="hydra.png">
</head>

<body class="arcade-body" data-certification="network-plus">

    <div class="crt-overlay"></div>

    <main class="world-screen">

        <!-- INTRO CARD -->
        <section class="world-intro-card">

            <h1 class="arcade-title">🌋 WORLD 7</h1>

            <h2 class="world-subtitle">Boss Rush</h2>

            <div class="message-box">

                <p>The toughest challenges</p>
                <p>stand before you.</p>

                <br>

                <p>Stay focused.</p>
                <p>Stay confident.</p>

                <br>

                <p>Victory is within reach.</p>

            </div>

            <button id="enterWorldBtn" class="link-btn">
                ▶ PRESS START
            </button>

            <br><br>

            <a href="network-campaign.html" class="back-link">
                ← Return to Campaign Map
            </a>

        </section>

        <!-- TRAINING MENU -->
        <section id="world7-menu" class="hidden">

            <h1 class="arcade-title">🌋 WORLD 7</h1>

            <p class="tagline">
                Choose Your Training Mode
            </p>

            <div class="mode-grid">

                
                <a href="hydra-quiz.html?world=7&amp;mode=boss-rush-1" class="mode-card">
                    🧭<br>
                    Boss Rush I
                </a>
                            
                <a href="hydra-quiz.html?world=7&amp;mode=boss-rush-2" class="mode-card">
                    🎮<br>
                    Boss Rush II
                </a>

                <a href="hydra-quiz.html?world=7&amp;mode=weakness-captains" class="mode-card">
                    🎯<br>
                    Weakness Captain Rush
                </a>

                <a href="hydra-quiz.html?world=7&amp;mode=final-captain-rush" class="mode-card">
                    ⚔️<br>
                    Final Captain Rush
                </a>

            </div>

            <br>

            <a href="network-campaign.html" class="back-link">
                ← Return to Campaign Map
            </a>

        </section>

    </main>

    <script>

        const enterWorldBtn = document.getElementById("enterWorldBtn");
        const introCard = document.querySelector(".world-intro-card");
        const worldMenu = document.getElementById("world7-menu");

        enterWorldBtn.addEventListener("click", () => {

            introCard.style.display = "none";
            worldMenu.classList.remove("hidden");

        });

    </script>

</body>
</html>
