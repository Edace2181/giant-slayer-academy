<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giant Slayer Academy | A+ Core 2 | World 7</title>
  <link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="hydra.png">
</head>
<body class="arcade-body" data-certification="aplus-core2">
  <div class="crt-overlay"></div>
  <main class="world-screen">
    <section class="world-intro-card">
      <h1 class="arcade-title">🌋 WORLD 7</h1>
      <h2 class="world-subtitle">Captain Challenges</h2>
      <div class="message-box"><p>A+ Core 2 • 220-1202</p><p>Captain-level challenges stand before you.</p><br><p>Trust your training.</p></div>
      <button id="enterWorldBtn" class="link-btn">▶ PRESS START</button><br><br>
      <a href="aplus-core2-campaign.html" class="back-link">← Return to Campaign Map</a>
    </section>
    <section id="world7-menu" class="hidden">
      <h1 class="arcade-title">🌋 WORLD 7</h1>
      <p class="tagline">Choose Your Training Mode</p>
      <div class="mode-grid"><a href="aplus-core2-quiz.html?world=7&amp;mode=boss-rush-1" class="mode-card">🧭<br>Boss Rush I</a>
        <a href="aplus-core2-quiz.html?world=7&amp;mode=boss-rush-2" class="mode-card">🎮<br>Boss Rush II</a>
        <a href="aplus-core2-quiz.html?world=7&amp;mode=weakness-captains" class="mode-card">🎯<br>Weakness Captain Rush</a>
        <a href="aplus-core2-quiz.html?world=7&amp;mode=final-captain-rush" class="mode-card">⚔️<br>Final Captain Rush</a></div><br>
      <a href="aplus-core2-campaign.html" class="back-link">← Return to Campaign Map</a>
    </section>
  </main>
  <script>
    const enterWorldBtn = document.getElementById("enterWorldBtn");
    const introCard = document.querySelector(".world-intro-card");
    const worldMenu = document.getElementById("world7-menu");
    enterWorldBtn.addEventListener("click", () => { introCard.style.display = "none"; worldMenu.classList.remove("hidden"); });
  </script>
</body>
</html>
