<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giant Slayer Academy | A+ Core 2 | Quiz</title>
  <link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="hydra.png">
</head>
<body class="arcade-body" data-progress-key="hydra-aplus-core2-progress-v1" data-certification="aplus-core2">
  <div class="crt-overlay"></div>
  <main class="world-screen"><section class="world-intro-card">
<h1 class="arcade-title">🐉 A+ CORE 2 QUIZ</h1>
<p class="tagline" id="quizInfo">Loading mode…</p>
<div class="player-card"><h3 id="objectiveTitle">Loading…</h3><p id="objectiveName"></p></div>
<div class="message-box"><p id="questionCount"></p><h2 id="question">Loading Question…</h2>
<div id="answers" class="answers-box"></div><br>
<button id="submitBtn" class="link-btn">Submit Answer</button><br><br>
<button id="nextBtn" class="link-btn hidden">Next Question</button><p id="feedback" role="status" aria-live="polite" aria-atomic="true"></p></div>
<div class="player-card"><h3>Commander Status</h3><p>🏆 Score: <span id="score">0</span></p><p>🐉 Hydra Rank: <span id="rank">Hatchling</span></p><p>⚔ Current Mode: <span id="modeDisplay">Objective Sweep</span></p></div>
<br><a href="#" id="returnLink" class="back-link">← Return</a>
</section></main>
<script src="campaign-ui.js"></script>
<script src="flagged-questions.js"></script>
<script src="practice-exam-timer.js"></script>
<script src="aplus-core2-quiz.js"></script>
<script src="objective-quiz-return.js"></script>
</body>
</html>
