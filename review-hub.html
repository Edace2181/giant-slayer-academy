<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydra Academy | Review Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="hydra.png">
</head>
<body class="arcade-body">
  <div class="crt-overlay"></div>
  <main class="world-screen review-hub-shell">
    <section class="world-intro-card">
      <h1 class="arcade-title">📚 REVIEW HUB</h1>
      <p id="reviewCertification" class="tagline">Loading certification…</p>

      <section id="reviewHubView">
        <div class="review-category-grid" aria-label="Review categories">
          <button class="review-category active" data-review-type="flags" type="button" aria-pressed="true">🚩<strong>Flagged Questions</strong><span>Available Now</span></button>
          <button class="review-category" data-review-type="incorrect" type="button" aria-pressed="false">❌<strong>Incorrect Answers</strong><span>Available Now</span></button>
          <button class="review-category" data-review-type="favorites" type="button" aria-pressed="false">⭐<strong>Favorites</strong><span>Available Now</span></button>
          <button class="review-category" data-review-type="weak" type="button" aria-pressed="false">📉<strong>Weak Objectives</strong><span>Available Now</span></button>
          <button class="review-category" data-review-type="adaptive" type="button" aria-pressed="false">🧠<strong>Adaptive Review</strong><span>Available Now</span></button>
          <button class="review-category" data-review-type="all" type="button" aria-pressed="false">📖<strong>All Review Questions</strong><span>Available Now</span></button>
          <button class="review-category" data-review-type="history" type="button" aria-pressed="false">📝<strong>Session History</strong><span>Available Now</span></button>
        </div>

        <div class="review-filter-bar">
          <label>World<select id="worldFilter"><option value="all">All Worlds</option></select></label>
          <label>Objective<select id="objectiveFilter"><option value="all">All Objectives</option></select></label>
          <label id="historyTypeFilter" class="hidden">Session Type<select id="sessionTypeFilter"><option value="all">All Session Types</option></select></label>
        </div>

        <p id="collectionSummary" class="review-summary" role="status"></p>
        <div id="collectionList" class="flagged-question-list"></div>
        <button id="startReview" class="link-btn" type="button">Review Flagged Questions</button>
      </section>

      <section id="reviewSession" class="hidden" aria-live="polite">
        <p id="reviewQuestionCount"></p>
        <div id="reviewSource" class="review-source"></div>
        <h2 id="reviewQuestion"></h2>
        <p id="reviewRecoveryStatus" class="recovery-progress"></p>
        <div id="reviewAnswers" class="answers-box"></div>
        <button id="reviewRemoveItem" class="flag-question-btn is-flagged" type="button">🚩 Flagged — Remove Flag</button>
        <br><br>
        <button id="reviewSubmit" class="link-btn" type="button">Submit Answer</button>
        <button id="reviewNext" class="link-btn hidden" type="button">Next Question</button>
        <div id="reviewFeedback" class="review-feedback"></div>
        <button id="returnToReviewList" class="back-link review-back-button" type="button">← Return to Flagged Questions</button>
      </section>

      <br>
      <a id="returnToCertification" href="index.html" class="back-link">← Return to Certification</a>
    </section>
  </main>
  <script src="campaign-ui.js"></script>
  <script src="flagged-questions.js"></script>
  <script src="review-hub.js"></script>
</body>
</html>
