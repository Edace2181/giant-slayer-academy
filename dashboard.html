<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giant Slayer Academy | Command Center</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="hydra.png">
</head>
<body class="arcade-body">
  <div class="crt-overlay"></div>
  <main class="command-center">
    <header class="command-center-hero">
      <img src="assets/command-center-warrior.png" alt="" class="command-center-character command-center-warrior" aria-hidden="true">
      <div class="command-center-hero-copy">
        <span class="campaign-kicker">STUDENT PROGRESS SYSTEM</span>
        <h1 class="arcade-title">GIANT SLAYER ACADEMY<br><span class="command-center-title-line">COMMAND CENTER</span></h1>
        <p class="engine-credit">Powered by the Hydra Learning Engine</p>
        <p class="tagline">Recognition builds mastery. Mastery conquers the Academy.</p>
      </div>
      <img src="assets/command-center-giant.png" alt="" class="command-center-character command-center-giant" aria-hidden="true">
    </header>

    <section id="academySummary" class="academy-summary" aria-labelledby="academyHeading">
      <h2 id="academyHeading">Overall Academy</h2>
    </section>

    <section aria-labelledby="campaignHeading">
      <h2 id="campaignHeading" class="dashboard-section-title">Certification Campaigns</h2>
      <div id="campaignDashboard" class="dashboard-grid"></div>
    </section>

    <footer class="arcade-footer">
      <a href="index.html" class="link-btn">🏰 Return to Academy 🏰</a>
    </footer>
  </main>
  <script src="campaign-ui.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
